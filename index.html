<html>

<head>
    <script src="Cesium-1.135/Build/Cesium/Cesium.js"></script>
    <script type="module" src="main.js"></script>
    <link href="Cesium-1.135/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body style="margin: 0px; padding: 0px;">
    
    <button id="btnFlyTop" class="floating-btn" title="Terug naar boven">
    <svg class="icon-svg" viewBox="0 0 24 24">
        <path d="M5 15l7-7 7 7" stroke="currentColor" stroke-width="3" fill="none"/>
        <path d="M12 8v13" stroke="currentColor" stroke-width="3"/>
    </svg>
</button>

    <div id="toolbox">
        <button class="accordion">Gebieden</button>
        <div class="panel">
            <button type="button" id="btnDrawArea">Draw Area</button>
            <button type="button" id="btnFinishArea">Finish Area</button>
            <button type="button" id="btnCancelArea">Cancel Area</button>
        </div>

        <button class="accordion">Objecten</button>
        <div class="panel">
            <button type="button" id="btnPlaceBuilding">Place Building</button>
            <button type="button" id="btnPlaceRoad">Place Road</button>
            <button type="button" id="btnPlaceTree">Place Tree</button>
        </div>

        <button class="accordion">Bewerken</button>
        <div class="panel">
            <button type="button" id="btnMove">Move</button>
            <button type="button" id="btnRotate">Rotate</button>
            <button type="button" id="btnScale">Scale</button>
            <button type="button" id="btnDelete">Verwijderen</button>
        </div>
    </div>

    <div id="sidebar">
        <div class="tabs">
            <button class="tab-btn" data-tab="tab-properties">Properties</button>
            <button class="tab-btn" data-tab="tab-gegevens">Gegevens</button>
            <button class="tab-btn active" data-tab="tab-agents">Agents</button>
        </div>

        <div class="sidebar-content">
            <div id="tab-properties" class="tab-section" style="display:none;">
                <h2>Properties</h2>

                <div id="prop-empty" style="color:#aaa; font-size:14px;">
                    Selecteer een structuur om eigenschappen te bewerken.
                </div>

                <div id="prop-form" style="display:none;">
                    <label style="display:block; margin-top:10px; font-size:13px;">Type</label>
                    <select id="prop-type" style="width:100%;">
                        <option value="building">building</option>
                        <option value="tree">tree</option>
                        <option value="road">road</option>
                        <option value="water">water</option>
                    </select>

                    <label style="display:block; margin-top:10px; font-size:13px;">Color</label>
                    <input id="prop-color" type="color" style="width:100%; height:34px;" />
                </div>
            </div>

            <div id="tab-gegevens" class="tab-section" style="display: none;">
                <h2>Gebiedsdata</h2>
                <p>Statistieken op basis van geplaatste structuren.</p>

                <div id="stats-root"></div>
            </div>


            <div id="tab-agents" class="tab-section">
                <h2>Agents</h2>
                
                <div id="agent-list-container"></div>

                <div class="sidebar-footer">
                    <button id="btnAgentPlaatsen" class="action-btn-main">Plaats Agent</button>
                </div>
            </div>

        </div>

    </div>

    <div id="cesiumContainer" style="margin: 0px; padding: 0px;"></div>
</body>

</html>
